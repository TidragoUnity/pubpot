# Grafana liest diese Datei beim Start: Die Datenquelle ist sofort da, ohne Klicken (E-053).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
