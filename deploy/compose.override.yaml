# Nur für die lokale Entwicklung. Wird von "docker compose" automatisch zusätzlich zu compose.yaml geladen,
# solange beide im selben Ordner liegen. Auf dem Server gibt es diese Datei nicht: Dort werden fertige Images
# aus der GitHub Container Registry gezogen (Phase 8), statt sie zu bauen.
#
# Alle Ports sind an 127.0.0.1 gebunden: erreichbar nur von deinem Rechner, nicht aus dem Netzwerk.

services:
  db:
    ports:
      # Damit "dotnet run" und Werkzeuge wie DBeaver die Datenbank lokal erreichen.
      - "127.0.0.1:5432:5432"
    volumes:
      # Auswertung der Twitch-Studie (src/TwitchWorker/README.md, Abschnitt "Auswerten").
      - ../src/TwitchWorker/sql:/sql:ro
      - ../src/TwitchWorker/export:/export

  # Lokal bauen statt aus der Registry ziehen. Build-Kontext ist die Repo-Wurzel (global.json, Directory.*.props).
  migrate:
    build:
      context: ..
      dockerfile: src/PubPot.Web/Dockerfile
      target: migrate

  web:
    build:
      context: ..
      dockerfile: src/PubPot.Web/Dockerfile
      target: web
    # Lokale Werte, solange in der .env nichts anderes steht: Mails gehen an Mailpit.
    environment:
      Smtp__Host: ${Smtp__Host:-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      Smtp__Security: ${Smtp__Security:-None}
      Smtp__FromAddress: ${Smtp__FromAddress:-pubpot@localhost.test}
      Notifications__Email: ${Notifications__Email:-team@localhost.test}
    depends_on:
      - mailpit

  # Alarm-Mails lokal an Mailpit (http://localhost:8025), wie die Mails der Website.
  alertmanager:
    environment:
      ALERT_EMAIL: ${ALERT_EMAIL:-${Notifications__Email:-team@localhost.test}}
      ALERT_SMTP_HOST: ${Smtp__Host:-mailpit}
      ALERT_SMTP_PORT: ${Smtp__Port:-1025}
      ALERT_SMTP_SECURITY: ${Smtp__Security:-None}
      ALERT_SMTP_FROM: ${Smtp__FromAddress:-pubpot@localhost.test}
    depends_on:
      - mailpit
  worker:
    build:
      context: ..
      dockerfile: src/TwitchWorker/Dockerfile

  # Fängt alle Mails ab, die die App lokal verschickt. Oberfläche: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # Weboberfläche
      - "127.0.0.1:1025:1025"   # SMTP für die App

  # Datenbank im Browser ansehen: http://localhost:8081 (System: PostgreSQL, Server: db)
  # Port 8081 statt 8080, weil 8080 noch vom Adminer der laufenden Twitch-Studie belegt ist.
  adminer:
    image: adminer:5.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
