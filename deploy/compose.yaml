# PubPot – Docker Compose
#
# Diese Datei gilt in ALLEN Umgebungen (lokal, staging, production).
# Lokal lädt Docker Compose automatisch zusätzlich compose.override.yaml (Mailpit, Adminer, lokale Werte, Build).
#
# Starten (aus diesem Ordner):   docker compose up -d --build
# Mit Twitch-Worker:             docker compose --profile worker up -d --build
# Status:                        docker compose ps
# Logs:                          docker compose logs -f web
#
# Passwörter und Einstellungen kommen aus der Datei .env in diesem Ordner (Vorlage: .env.example, nie committen).
# Compose liest die .env nur zum Einsetzen der ${…}-Werte unten. Jeder Container bekommt ausschließlich die
# Variablen, die bei ihm unter "environment:" stehen. Die Web-App sieht also nie das Twitch-Secret.
#
# Startreihenfolge: db gesund → migrate erfolgreich beendet → web gesund → caddy.
#                   db gesund → migrate-twitch erfolgreich beendet → worker (nur mit Profil "worker").
#
# Netze (E-038): "edge" verbindet nur Caddy und web. Alle anderen Dienste hängen im Netz "default".
# Caddy kommt dadurch nie an die Datenbank, und von außen erreichbar ist nur Caddy (Ports 80 und 443).

name: pubpot

# Gemeinsame Härtung für unsere eigenen Container (E-037). "<<: *hardening" fügt diese Zeilen in den Dienst ein.
x-hardening: &hardening
  # Dateisystem schreibgeschützt: Ein Angreifer kann im Container nichts ablegen oder verändern.
  read_only: true
  # Ausnahme /tmp, nur im Arbeitsspeicher (Heartbeat des Workers, temporäre Dateien von .NET).
  tmpfs:
    - /tmp
  # Prozesse können sich keine zusätzlichen Rechte verschaffen (z. B. über setuid-Programme).
  security_opt:
    - no-new-privileges:true
  # Alle Linux-Sonderrechte entziehen. Unsere Programme brauchen keine (Port 8080 liegt über 1024).
  cap_drop:
    - ALL

# Log-Rotation für alle Dienste (E-050). Ohne Grenze schreibt Docker die Logs endlos weiter, bis die Platte voll ist.
# Pro Container höchstens 5 Dateien zu 10 MB. "docker compose logs" liest sie weiterhin.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:16.16
    restart: unless-stopped
    environment:
      # Superuser – nur für Verwaltung und das Init-Skript, nicht für die Anwendungen.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in deploy/.env setzen}
      # Eigene Benutzer für Web und Worker (siehe db/init/01-databases.sh).
      PUBPOT_DB_PASSWORD: ${PUBPOT_DB_PASSWORD:?PUBPOT_DB_PASSWORD in deploy/.env setzen}
      TWITCH_DB_PASSWORD: ${TWITCH_DB_PASSWORD:?TWITCH_DB_PASSWORD in deploy/.env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skripte in diesem Ordner laufen genau einmal: beim allerersten Start mit leerem Volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Über TCP wie die Anwendungen, nicht über den lokalen Socket: Beim allerersten Start läuft kurz ein
      # temporärer Server nur am Socket (Init-Skripte), dann wäre "gesund" zu früh gemeldet (gefunden in 7.4).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Bewusst kein "ports:" – die Datenbank ist nur im internen Docker-Netz erreichbar, nie aus dem Internet.

  # Einmaliger Container: spielt die EF-Migrationen der Web-App ein und beendet sich (E-035).
  migrate:
    logging: *logging
    image: ghcr.io/tidragounity/pubpot-migrate:${IMAGE_TAG:-local}
    <<: *hardening
    restart: "no"
    environment:
      ConnectionStrings__Default: Host=db;Database=pubpot;Username=pubpot;Password=${PUBPOT_DB_PASSWORD:?PUBPOT_DB_PASSWORD in deploy/.env setzen}
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *logging
    image: ghcr.io/tidragounity/pubpot-web:${IMAGE_TAG:-local}
    <<: *hardening
    restart: unless-stopped
    # Leere Werte sind hier erlaubt: Die App prüft beim Start selbst, ob alles Nötige da ist, und bricht sonst
    # mit klarer Meldung ab (SMTP, Site__BaseUrl). Lokale Werte stehen in compose.override.yaml.
    environment:
      ConnectionStrings__Default: Host=db;Database=pubpot;Username=pubpot;Password=${PUBPOT_DB_PASSWORD:?PUBPOT_DB_PASSWORD in deploy/.env setzen}
      # Links in Mails. Standard: die Domain, unter der Caddy die Seite ausliefert.
      Site__BaseUrl: ${Site__BaseUrl:-https://${SITE_DOMAIN:-localhost}}
      # Nur Caddy (Netz "edge", Subnetz siehe unten bei networks) darf Client-IP und HTTPS melden (E-033).
      Proxy__KnownNetworks: ${EDGE_SUBNET:-172.30.0.0/24}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__Security: ${Smtp__Security:-StartTls}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__FromAddress: ${Smtp__FromAddress:-}
      Smtp__FromName: ${Smtp__FromName:-PubPot}
      Admin__Username: ${Admin__Username:-admin}
      Admin__PasswordHash: ${Admin__PasswordHash:-}
      Notifications__Email: ${Notifications__Email:-}
      Notifications__DiscordWebhookUrl: ${Notifications__DiscordWebhookUrl:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - edge

  # Reverse Proxy mit automatischem HTTPS (E-038). Der einzige Dienst mit Ports nach außen.
  caddy:
    logging: *logging
    image: caddy:2.11.9
    <<: *hardening
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    # BIND_ADDRESS: lokal 127.0.0.1 (nur dein Rechner), auf dem Server 0.0.0.0. 443/udp ist HTTP/3.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Zertifikate und Caddys lokale Zertifizierungsstelle. Geht das Volume verloren, holt Caddy neue.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edge
      # Nur für den Blackbox-Exporter (Profil "monitoring"). Darüber erreicht Caddy sonst nichts.
      - probe
    depends_on:
      web:
        condition: service_healthy

  # Einmaliger Container: spielt die SQL-Skripte des Workers ein (deploy/db/twitch, E-036).
  # Läuft im Postgres-Image, weil das psql schon mitbringt.
  migrate-twitch:
    logging: *logging
    image: postgres:16.16
    profiles: [worker]
    <<: *hardening
    restart: "no"
    user: postgres
    entrypoint: ["sh", "/migrations/migrate.sh"]
    environment:
      PGHOST: db
      PGDATABASE: twitch
      PGUSER: twitch
      PGPASSWORD: ${TWITCH_DB_PASSWORD:?TWITCH_DB_PASSWORD in deploy/.env setzen}
    volumes:
      - ./db/twitch:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # Twitch-Worker. Startet nur mit dem Profil "worker" (F-016, E-032):
  #   docker compose --profile worker up -d     oder dauerhaft COMPOSE_PROFILES=worker in der .env
  worker:
    logging: *logging
    image: ghcr.io/tidragounity/pubpot-worker:${IMAGE_TAG:-local}
    profiles: [worker]
    <<: *hardening
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Database=twitch;Username=twitch;Password=${TWITCH_DB_PASSWORD:?TWITCH_DB_PASSWORD in deploy/.env setzen}
      # Fehlen die Zugangsdaten, bricht der Worker beim Start mit klarer Meldung ab.
      Twitch__ClientId: ${Twitch__ClientId:-}
      Twitch__ClientSecret: ${Twitch__ClientSecret:-}
      Worker__Languages: ${Worker__Languages:-de}
      Worker__IntervalMinutes: ${Worker__IntervalMinutes:-5}
      Worker__StopAfterHours: ${Worker__StopAfterHours:-0}
      Worker__GameIds: ${Worker__GameIds:-}
      Worker__UserLogins: ${Worker__UserLogins:-}
      Worker__PushUrl: ${Worker__PushUrl:-}
    depends_on:
      db:
        condition: service_healthy
      migrate-twitch:
        condition: service_completed_successfully

  # --- Monitoring (Profil "monitoring", E-053) ---------------------------------------------------------------
  # Starten: docker compose --profile monitoring up -d
  # Oberflächen nur auf 127.0.0.1, auch auf dem Server. Dort per SSH-Tunnel (F-009), nie offen im Internet.

  # Sammelt alle 15 Sekunden die Messwerte und speichert sie 30 Tage (höchstens 2 GB).
  prometheus:
    logging: *logging
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    <<: *hardening
    restart: unless-stopped
    # start.sh setzt die Domain in prometheus.yml ein (für die Blackbox-Prüfungen, E-054) und startet Prometheus.
    entrypoint: ["sh", "/etc/prometheus/start.sh"]
    command:
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Dashboards. Datenquelle und Start-Dashboard kommen als Dateien aus monitoring/grafana (kein Klicken nötig).
  grafana:
    logging: *logging
    image: grafana/grafana:13.3.2
    profiles: [monitoring]
    <<: *hardening
    restart: unless-stopped
    # Ohne Passwort startet Grafana nicht, statt still mit admin/admin zu laufen. (":?" geht hier nicht:
    # Compose prüft das auch ohne Profil "monitoring" und würde dann jeden Start verhindern.)
    entrypoint: ["/bin/sh", "-c", '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD in deploy/.env setzen" >&2; exit 1; }; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Keine Verbindungen nach außen: keine Statistik, keine Update-Prüfung, kein News-Feed, keine Plugin-Downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Prüft die Website von außen gesehen: über Caddy, mit HTTPS und der echten Domain (E-054).
  # Hängt dafür im eigenen Netz "probe", das es nur mit Caddy teilt. Das Netz "edge" bleibt Caddy und web vorbehalten.
  blackbox:
    logging: *logging
    image: prom/blackbox-exporter:v0.29.1
    profiles: [monitoring]
    <<: *hardening
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks:
      - default
      - probe

  # Messwerte des Servers: CPU, Arbeitsspeicher, Festplatte. Liest das Dateisystem des Servers nur lesend.
  node-exporter:
    logging: *logging
    image: prom/node-exporter:v1.13.1
    profiles: [monitoring]
    <<: *hardening
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    # Ohne "rslave": Docker Desktop lehnt es ab. Es betrifft nur später eingehängte Laufwerke, "/" ist so sichtbar.
    volumes:
      - /:/host:ro

  # Messwerte pro Container: CPU und Arbeitsspeicher je Compose-Dienst.
  # Braucht Lesezugriff auf Docker und den Kernel. Kein Port nach außen, nur Prometheus fragt ihn ab (E-053).
  cadvisor:
    logging: *logging
    image: ghcr.io/google/cadvisor:v0.61.1
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      # Nur das Label mit dem Dienstnamen übernehmen, keine anderen Labels oder Umgebungsvariablen.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      # Messwerte, die wir nicht brauchen und die viele Zeitreihen erzeugen.
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  # Festes Subnetz, damit die App weiß, wem sie die Forwarded-Header glauben darf (Proxy__KnownNetworks bei web).
  # Pro Rechner darf jedes Subnetz nur einmal vorkommen: Ein zweites Projekt (z. B. staging neben production)
  # braucht ein eigenes, etwa EDGE_SUBNET=172.31.0.0/24.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  # Blackbox-Exporter → Caddy (E-054).
  probe:
