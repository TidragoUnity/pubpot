services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: twitch
      POSTGRES_USER: twitch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro          # Auswertungs-Skripte
      - ./export:/export       # CSV-Exporte landen hier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch -d twitch"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Bewusst kein "ports:": Die Datenbank ist nur für den Worker erreichbar, nicht aus dem Internet.

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Default: "Host=db;Database=twitch;Username=twitch;Password=${POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
