# CI: Build, Code-Stil und Tests bei jedem Pull Request und auf main (E-041).
# Die Prüfungen selbst stehen in scripts/check.sh – dieselben wie lokal. Was lokal grün ist, ist es auch hier.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Standardmäßig darf der Workflow nur lesen. Jobs, die mehr brauchen, fordern es einzeln an.
permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den alten Lauf ab. Auf main laufen alle Läufe zu Ende.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build und Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Fremde Actions sind auf einen Commit-SHA festgenagelt (Lieferkette). Dependabot hält sie aktuell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SDK 11 aus global.json zum Bauen, dazu .NET 10 für die Laufzeit der Tests (Ziel ist net10.0, E-007).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # NuGet-Pakete zwischenspeichern. Der Schlüssel ändert sich nur, wenn sich Paketversionen ändern.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Build (Warnungen als Fehler), dotnet format, beide Testprojekte. Testcontainers nutzt das Docker des Runners.
      - name: Prüfen wie lokal (scripts/check.sh)
        run: ./scripts/check.sh

  images:
    name: Images und Smoke-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Tag = Commit-SHA. Genau diese Images schiebt 6.3 später nach GHCR.
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx kann den Build-Cache in GitHub Actions speichern (type=gha): unveränderte Schichten kommen
      # beim nächsten Lauf aus dem Cache, z. B. das NuGet-Restore.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image web bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/PubPot.Web/Dockerfile
          target: web
          tags: ghcr.io/tidragounity/pubpot-web:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image migrate bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/PubPot.Web/Dockerfile
          target: migrate
          tags: ghcr.io/tidragounity/pubpot-migrate:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Image worker bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/TwitchWorker/Dockerfile
          tags: ghcr.io/tidragounity/pubpot-worker:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Startet den Stack aus deploy/compose.yaml wie auf dem Server und prüft ihn (E-042).
      - name: Compose-Smoke-Test (scripts/smoke-test.sh)
        run: ./scripts/smoke-test.sh

      - name: Image-Größen
        if: always()
        run: |
          {
            echo '### Image-Größen (entpackt)'
            echo '```'
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|tidragounity'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
