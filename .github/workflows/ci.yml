# CI: Build, Code-Stil und Tests bei jedem Pull Request und auf main (E-041).
# Die Prüfungen selbst stehen in scripts/check.sh – dieselben wie lokal. Was lokal grün ist, ist es auch hier.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Montags 05:17 UTC: neue Sicherheitslücken werden bekannt, auch wenn sich am Code nichts ändert (Trivy, E-044).
  schedule:
    - cron: "17 5 * * 1"
  # Lauf von Hand starten (Reiter Actions → CI → Run workflow).
  workflow_dispatch:

# Standardmäßig darf der Workflow nur lesen. Jobs, die mehr brauchen, fordern es einzeln an.
permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den alten Lauf ab. Auf main laufen alle Läufe zu Ende.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build und Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Fremde Actions sind auf einen Commit-SHA festgenagelt (Lieferkette). Dependabot hält sie aktuell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SDK 11 aus global.json zum Bauen, dazu .NET 10 für die Laufzeit der Tests (Ziel ist net10.0, E-007).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # NuGet-Pakete zwischenspeichern. Der Schlüssel ändert sich nur, wenn sich Paketversionen ändern.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Build (Warnungen als Fehler), dotnet format, beide Testprojekte. Testcontainers nutzt das Docker des Runners.
      - name: Prüfen wie lokal (scripts/check.sh)
        run: ./scripts/check.sh

  images:
    name: Images und Smoke-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Tag = Commit-SHA. Genau diese Images schiebt 6.3 später nach GHCR.
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx kann den Build-Cache in GitHub Actions speichern (type=gha): unveränderte Schichten kommen
      # beim nächsten Lauf aus dem Cache, z. B. das NuGet-Restore.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image web bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/PubPot.Web/Dockerfile
          target: web
          tags: ghcr.io/tidragounity/pubpot-web:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Image migrate bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/PubPot.Web/Dockerfile
          target: migrate
          tags: ghcr.io/tidragounity/pubpot-migrate:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Image worker bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/TwitchWorker/Dockerfile
          tags: ghcr.io/tidragounity/pubpot-worker:${{ env.IMAGE_TAG }}
          load: true
          provenance: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Startet den Stack aus deploy/compose.yaml wie auf dem Server und prüft ihn (E-042).
      - name: Compose-Smoke-Test (scripts/smoke-test.sh)
        run: ./scripts/smoke-test.sh

      # Trivy aus einem unveränderlichen Release, Version fest (E-044). Die trivy-action wurde im März 2026
      # über umgebogene Tags kompromittiert. Deshalb nur festgenagelte SHAs und eine feste Trivy-Version.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true

      # Bericht: hohe und kritische Lücken, für die es ein Update gibt. Rot wird der Lauf nur bei kritischen.
      - name: Image-Scan (Trivy)
        run: |
          status=0
          echo "### Image-Scan (Trivy): hohe und kritische Lücken mit verfügbarem Update" >> "$GITHUB_STEP_SUMMARY"
          for image in web migrate worker; do
            ref="ghcr.io/tidragounity/pubpot-$image:$IMAGE_TAG"
            echo "::group::Trivy pubpot-$image"
            trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL               --format table --output "trivy-$image.txt" "$ref"
            cat "trivy-$image.txt"
            if ! trivy image --quiet --skip-db-update --scanners vuln --ignore-unfixed --severity CRITICAL                  --exit-code 1 --format table --output /dev/null "$ref"; then
              echo "::error title=Trivy pubpot-$image::Kritische Lücke mit verfügbarem Update gefunden"
              status=1
            fi
            echo "::endgroup::"
            { echo "#### pubpot-$image"; echo '```'; cat "trivy-$image.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Image-Größen
        if: always()
        run: |
          {
            echo '### Image-Größen (entpackt)'
            echo '```'
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|tidragounity'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Nur auf main und nur, wenn Tests und Smoke-Test grün sind: Images nach GHCR schieben (E-043).
  publish:
    name: Push nach GHCR (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Schreibrecht für Packages nur in diesem Job, nicht im ganzen Workflow.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            file: src/PubPot.Web/Dockerfile
            target: web
            description: PubPot Website (ASP.NET Core)
          - image: migrate
            file: src/PubPot.Web/Dockerfile
            target: migrate
            description: PubPot Datenbank-Migrationen (EF-Bundle)
          - image: worker
            file: src/TwitchWorker/Dockerfile
            target: ""
            description: PubPot Twitch-Worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Anmeldung mit dem automatischen GITHUB_TOKEN dieses Laufs. Kein eigenes Secret nötig.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: Commit-SHA (unveränderlich, damit deployt Phase 8) und "main" (immer der neueste Stand).
      # Dazu OCI-Labels wie Quelle und Commit. Das Label "source" verknüpft das Package mit diesem Repo.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tidragounity/pubpot-${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=pubpot-${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      # Gleicher Build wie im Job "images": Alle Schichten kommen aus dem Cache, es entsteht derselbe Inhalt.
      # SBOM (Liste aller Pakete im Image) und Provenance (wie und woraus es gebaut wurde) hängen am Image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}

      # Werte aus ${{ }} nie direkt ins Skript schreiben (Script Injection), sondern als Umgebungsvariable übergeben.
      - name: Zusammenfassung
        env:
          IMAGE: pubpot-${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
