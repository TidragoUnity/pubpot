# CodeQL: sucht im C#-Code und in den Workflows nach typischen Sicherheitsfehlern (E-046).
# Funde erscheinen im Reiter "Security" → "Code scanning" und als Kommentar im Pull Request.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Mittwochs: neue Prüfregeln von GitHub laufen auch ohne Code-Änderung über das Repo.
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Ergebnisse an GitHub Code Scanning melden.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # C#: mit echtem Build, damit CodeQL den Code so sieht wie der Compiler (genauer als ohne Build).
          - language: csharp
            build-mode: manual
          # GitHub-Workflows: findet z. B. Script Injection über ${{ }} und zu weite Rechte.
          - language: actions
            build-mode: none
          # Die kleinen Skripte in wwwroot/js (z. B. Sprachhinweis, Design-Umschalter).
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Zusätzlich zu den Standardregeln die erweiterten Sicherheitsregeln.
          queries: security-extended

      - if: matrix.build-mode == 'manual'
        name: Build für CodeQL
        run: dotnet build PubPot.slnx -c Release -nologo -v q

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
